server_tokens off;

# Canonical domain: semua request www diarahkan permanen ke non-www.
# HTTPS ditangani oleh Direction Host sebelum request masuk ke container ini.
server {
    listen 80;
    listen [::]:80;

    server_name www.kopibanget.my.id;

    return 301 https://kopibanget.my.id$request_uri;
}

# Aplikasi utama Laravel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name kopibanget.my.id;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 100M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Hanya index.php Laravel yang boleh dieksekusi.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_adi:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # HTTPS sudah ditangani oleh Direction Host.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_HOST $host;

        fastcgi_hide_header X-Powered-By;
    }

    # Tolak eksekusi file PHP lainnya.
    location ~ \.php$ {
        return 404;
    }

    # Lindungi file seperti .env dan .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}